# Builds the release assets from a tag and attaches them together with a
# provenance attestation, so anyone can verify with `gh attestation verify`
# that main.js and styles.css were built by this workflow from this repository.
#
#   git tag 1.0.0 && git push origin 1.0.0
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Type-check, build, unit tests and the bundle gate. A tag that does not
      # pass is not released.
      - run: npm test

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Extract the release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json styles.css
